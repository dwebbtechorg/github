name: Deploy docs to self-hosted host

# The self-hosted runner runs inside a container, so Docker work has to happen
# on the real host. We copy the build context to the host over SCP, then SSH in
# (172.17.0.1 = Docker bridge gateway back to the host) to build the image and
# run it as a container using host networking.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: example-mkdocs
  CONTAINER_NAME: example-mkdocs
  HOST_DIR: /home/dave/mkdocs-site

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy build context to host
        uses: appleboy/scp-action@v0.1.7
        with:
          # 172.17.0.1 is the default Docker bridge gateway to reach the host.
          host: 172.17.0.1
          username: dave
          key: ${{ secrets.SANDSLASH_SSH }}
          source: "Dockerfile,mkdocs.yml,requirements.txt,.dockerignore,docs"
          target: ${{ env.HOST_DIR }}
          overwrite: true

      - name: Build and run container on host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.17.0.1
          username: dave
          key: ${{ secrets.SANDSLASH_SSH }}
          envs: IMAGE_NAME,CONTAINER_NAME,HOST_DIR,GITHUB_SHA
          script: |
            set -e
            cd "$HOST_DIR"

            echo "Building image ${IMAGE_NAME}..."
            docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" -t "${IMAGE_NAME}:latest" .

            echo "Removing any existing container..."
            docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

            echo "Starting container with host networking..."
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --network host \
              --restart unless-stopped \
              "${IMAGE_NAME}:latest"

            echo "Waiting for the site to come up on http://localhost:8000 ..."
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:8000/ >/dev/null; then
                echo "Site is up."
                docker ps --filter "name=${CONTAINER_NAME}"
                exit 0
              fi
              sleep 2
            done

            echo "Site did not respond in time. Container logs:"
            docker logs "${CONTAINER_NAME}" || true
            exit 1
